# hello-world-chart/values.yaml
replicaCount: 1

image:
  #repository: "<+serviceVariables.repo>"
  #tag: "<+serviceVariables.tag>"
  pullPolicy: Always

serviceVariables:
  repo: "<+serviceVariables.repo>"
  primary:
    tag: "<+serviceVariables.tag>"

service:
  type: ClusterIP
  port: 8080

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

podLabels:
# Add custom labels to the pod
podAnnotations: {}
ingress:
  enabled: false

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory:

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50
