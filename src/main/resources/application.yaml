spring:
  application:
    name: HelloWorldApplication
  security:
    actuator:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    root: DEBUG
    org.springframework: DEBUG
    com.example.helloworldapplication: DEBUG
