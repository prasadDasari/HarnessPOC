template:
  name: hello-world-helm-pipeline
  identifier: helloworldhelmpipeline
  versionLabel: v1
  type: Pipeline
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  spec:
    stages:
      - stage:
          name: Deploy-hello-world-helm
          identifier: Deployhelloworldhelm
          tags: {}
          template:
            templateRef: HelloWorldHelmTemplate
            versionLabel: v1
            templateInputs:
              # Use the HelmDeployment type for Helm charts
              type: HelmDeployment
              spec:
                service:
                  serviceInputs:
                    serviceDefinition:
                      # Use Helm instead of Kubernetes
                      type: Helm
                      spec:
                        artifacts:
                          primary:
                            primaryArtifactRef: <+input>
                            sources: <+input>
                        variables:
                          - name: tag
                            type: String
                            # Fetch the tag value dynamically using the service variables
                            value: <+serviceVariables.tag>
